<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사랑나눔 빨간밥차 봉사자 모집</title>
    <!-- Pretendard 폰트 로드 -->
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <script>
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }

        if (window.location.hash) {
            history.replaceState(null, document.title, window.location.pathname + window.location.search);
        }

        window.scrollTo(0, 0);
    </script>
    <style>
        /* 기본 설정 */
        :root {
            --paper: #FAF8F8;
            --powder: #F7858D;
            --sky: #F04953;
            --periwinkle: #A81A22;
            --blue: #F04953;
            --ink: #2E4A4F;
            --muted: #8C7D7E;
            --surface: rgba(255, 255, 255, 0.86);
            --line: rgba(240, 73, 83, 0.22);
            --soft-line: rgba(240, 73, 83, 0.16);
            --shadow: 0 26px 80px rgba(240, 73, 83, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background:
                linear-gradient(180deg, var(--paper) 0%, #FDF0F1 42svh, #ffffff 100%);
            color: var(--ink);
            line-height: 1.6;
        }

        /* 1. 상단 인트로 영역 */
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 100svh;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: clamp(22px, 4vw, 54px);
            background:
                linear-gradient(180deg, var(--paper) 0%, #FDF0F1 58%, #ffffff 100%);
            isolation: isolate;
        }

        .hero-section::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            background:
                linear-gradient(180deg, rgba(250, 248, 248, 0.08) 0%, rgba(240, 73, 83, 0.14) 58%, #ffffff 100%);
            opacity: 0;
            animation: revealStage 0.8s ease 3.1s forwards;
        }

        .hero-video-frame {
            position: absolute;
            top: 0;
            left: 50%;
            width: 100%;
            height: 100%;
            transform: translateX(-50%);
            z-index: 1;
            overflow: hidden;
            border: 4px solid rgba(255, 255, 255, 0);
            background-color: var(--paper);
            animation: shrinkVideo 1.95s cubic-bezier(0.16, 1, 0.3, 1) 3s forwards;
            will-change: top, left, width, height, transform, border-radius, box-shadow;
        }

        .hero-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 1;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            width: min(1050px, 100%);
            padding-bottom: clamp(58px, 8vh, 92px);
            color: var(--ink);
            text-align: center;
            opacity: 0;
            transform: translateY(38px);
            animation: riseCopy 0.95s cubic-bezier(0.19, 1, 0.22, 1) 3.35s forwards;
        }

        .hero-text {
            color: inherit;
        }

        .hero-text h1 {
            font-size: clamp(30px, 5.5vw, 62px);
            font-weight: 900;
            line-height: 1.22;
            word-break: keep-all;
            text-shadow: 0 10px 34px rgba(255, 255, 255, 0.72);
        }

        .hero-text .highlight {
            color: var(--blue);
        }

        .hero-subtitle {
            margin-top: 18px;
            color: var(--muted);
            font-size: clamp(16px, 2.2vw, 21px);
            font-weight: 500;
            word-break: keep-all;
        }

        .scroll-cue {
            position: absolute;
            left: 50%;
            bottom: clamp(18px, 4vh, 34px);
            z-index: 4;
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(240, 73, 83, 0.32);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.78);
            color: var(--blue);
            text-decoration: none;
            backdrop-filter: blur(12px);
            opacity: 0;
            transform: translateX(-50%);
            animation:
                showCue 0.5s ease 4s forwards,
                cueFloat 1.6s ease-in-out 4.5s infinite;
        }

        .scroll-cue::after {
            content: "";
            position: absolute;
            inset: 8px;
            border: 1px solid rgba(168, 26, 34, 0.22);
            border-radius: inherit;
        }

        .scroll-cue span {
            width: 14px;
            height: 14px;
            margin-top: -4px;
            border-right: 2px solid currentColor;
            border-bottom: 2px solid currentColor;
            transform: rotate(45deg);
        }

        /* 2.5 중간 스크롤 유도 아이콘 */
        .middle-scroll-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 6px auto 38px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.95s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .middle-scroll-container.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .middle-scroll-cue {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(240, 73, 83, 0.32);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.86);
            color: var(--blue);
            text-decoration: none;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(240, 73, 83, 0.1);
            animation: middleCueFloat 1.6s ease-in-out infinite;
            position: relative;
            transition: border-color 0.3s, color 0.3s, background-color 0.3s, box-shadow 0.3s;
        }

        .middle-scroll-cue:hover {
            border-color: var(--blue);
            background-color: #ffffff;
            color: var(--periwinkle);
            box-shadow: 0 10px 28px rgba(240, 73, 83, 0.18);
        }

        .middle-scroll-cue::after {
            content: "";
            position: absolute;
            inset: 6px;
            border: 1px solid rgba(168, 26, 34, 0.22);
            border-radius: inherit;
        }

        .middle-scroll-cue span {
            width: 12px;
            height: 12px;
            margin-top: -3px;
            border-right: 2px solid currentColor;
            border-bottom: 2px solid currentColor;
            transform: rotate(45deg);
        }

        /* 2. 메인 컨텐츠 영역 (설명 + 폼) */
        .main-container {
            position: relative;
            z-index: 5;
            max-width: 880px;
            margin: -44px auto 0;
            padding: 86px 20px 104px;
        }

        .main-container::before {
            content: "";
            display: block;
            width: 64px;
            height: 4px;
            margin: 0 auto 28px;
            border-radius: 999px;
            background: linear-gradient(90deg, #F7858D, #F04953, #A81A22);
            opacity: 0;
            transform: scaleX(0.45);
            transform-origin: center;
            transition: opacity 0.7s ease, transform 0.9s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .main-container.is-visible::before {
            opacity: 1;
            transform: scaleX(1);
        }

        /* 안내 설명 박스 */
        .info-box {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(240, 73, 83, 0.08));
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: clamp(30px, 5vw, 44px);
            margin-bottom: 42px;
            box-shadow: var(--shadow);
            opacity: 0;
            transform: translateY(46px) scale(0.975);
            transition:
                opacity 0.8s ease,
                transform 0.95s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.95s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }

        .info-box.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .info-box::before,
        .form-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--sky), var(--blue), transparent);
            transform: translateX(-100%);
            opacity: 0;
        }

        .info-box.is-visible::before,
        .form-box.is-visible::before {
            opacity: 1;
            animation: lineSweep 1.15s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        .info-box h2 {
            font-size: clamp(24px, 4vw, 34px);
            color: var(--ink);
            margin-bottom: 28px;
            text-align: center;
            font-weight: 900;
        }

        .info-list {
            list-style: none;
        }

        .info-list li {
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 18px;
            align-items: start;
            margin-bottom: 18px;
            font-size: 18px;
            border-bottom: 1px solid var(--soft-line);
            padding-bottom: 18px;
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 0.55s ease, transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .info-box.is-visible .info-list li {
            opacity: 1;
            transform: translateY(0);
        }

        .info-box.is-visible .info-list li:nth-child(1) { transition-delay: 0.12s; }
        .info-box.is-visible .info-list li:nth-child(2) { transition-delay: 0.2s; }
        .info-box.is-visible .info-list li:nth-child(3) { transition-delay: 0.28s; }
        .info-box.is-visible .info-list li:nth-child(4) { transition-delay: 0.36s; }

        .info-list li:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .info-list strong {
            min-height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 5px 10px;
            border-radius: 999px;
            background-color: rgba(240, 73, 83, 0.12);
            color: var(--ink);
            font-size: 15px;
            font-weight: 900;
        }

        .info-list span {
            color: #A81A22;
            font-weight: 600;
        }

        /* 신청 폼 영역 */
        .form-box {
            position: relative;
            overflow: hidden;
            padding: clamp(30px, 5vw, 44px);
            border: 1px solid var(--line);
            border-radius: 8px;
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(240, 73, 83, 0.08));
            box-shadow: 0 14px 44px rgba(240, 73, 83, 0.08);
            opacity: 0;
            transform: translateY(46px) scale(0.975);
            transition:
                opacity 0.8s ease,
                transform 0.95s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.95s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }

        .form-box.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .form-box h2 {
            font-size: clamp(24px, 4vw, 32px);
            margin-bottom: 30px;
            text-align: center;
            font-weight: 900;
            color: var(--ink);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 16px;
            color: var(--muted);
        }

        .form-group input {
            width: 100%;
            padding: 16px;
            border: 1px solid rgba(240, 73, 83, 0.26);
            border-radius: 8px;
            font-size: 16px;
            background-color: rgba(250, 246, 246, 0.84);
            color: var(--ink);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input::placeholder {
            color: rgba(46, 74, 79, 0.42);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(240, 73, 83, 0.16);
            background-color: #ffffff;
        }

        /* 제출 버튼 */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--periwinkle), var(--blue));
            color: #ffffff;
            padding: 18px;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s, transform 0.1s, box-shadow 0.3s;
            box-shadow: 0 14px 30px rgba(85, 141, 236, 0.22);
        }

        .submit-btn:hover {
            box-shadow: 0 16px 34px rgba(240, 73, 83, 0.32);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            background: var(--powder);
            cursor: not-allowed;
            box-shadow: none;
        }

        @keyframes shrinkVideo {
            from {
                top: 0;
                left: 50%;
                width: 100%;
                height: 100%;
                transform: translateX(-50%);
                border-radius: 0;
                box-shadow: none;
            }
            to {
                top: clamp(18px, 4vh, 42px);
                left: 50%;
                width: min(1120px, calc(100% - clamp(32px, 10vw, 96px)));
                height: clamp(280px, 50svh, 500px);
                transform: translateX(-50%);
                border-radius: 8px;
                border-color: rgba(255, 255, 255, 0.95);
                box-shadow: 0 28px 90px rgba(240, 73, 83, 0.22);
            }
        }

        @keyframes middleCueFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(8px); }
        }

        @keyframes revealStage {
            to { opacity: 1; }
        }

        @keyframes riseCopy {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes showCue {
            to { opacity: 1; }
        }

        @keyframes cueFloat {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, 8px); }
        }

        @keyframes lineSweep {
            to { transform: translateX(100%); }
        }

        /* 모바일 대응 반응형 설정 */
        @media (max-width: 760px) {
            .hero-section {
                padding: 18px;
            }

            .hero-content {
                padding-bottom: 76px;
            }

            .hero-subtitle {
                margin-top: 14px;
            }

            @keyframes shrinkVideo {
                from {
                    top: 0;
                    left: 50%;
                    width: 100%;
                    height: 100%;
                    transform: translateX(-50%);
                    border-radius: 0;
                    box-shadow: none;
                }
                to {
                    top: 14px;
                    left: 50%;
                    width: calc(100% - 28px);
                    height: 42svh;
                    transform: translateX(-50%);
                    border-radius: 8px;
                    border-color: rgba(255, 255, 255, 0.95);
                    box-shadow: 0 24px 70px rgba(240, 73, 83, 0.22);
                }
            }
        }

        @media (max-width: 600px) {
            .info-box {
                padding: 30px 20px;
            }
            .info-list li {
                grid-template-columns: 1fr;
                gap: 4px;
                font-size: 16px;
            }
            .info-list strong {
                color: var(--ink);
            }

            .main-container {
                padding-top: 64px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .hero-section::before,
            .hero-video-frame,
            .hero-content,
            .scroll-cue,
            .info-box.is-visible::before,
            .form-box.is-visible::before {
                animation-duration: 0.01ms;
                animation-delay: 0ms;
                animation-iteration-count: 1;
            }

            .main-container::before,
            .info-box,
            .form-box,
            .info-list li {
                opacity: 1;
                transform: none;
                transition: none;
            }
        }
    </style>
</head>
<body>

    <!-- 1. 영상 배경 인트로 섹션 -->
    <header class="hero-section">
        <div class="hero-video-frame">
            <video class="hero-video" autoplay muted loop playsinline>
                <source src="./volunteer_video.mp4" type="video/mp4">
            </video>
        </div>

        <div class="hero-content">
            <div class="hero-text">
                <h1><span class="highlight">빨간밥차</span>와 함께<br>따뜻한 한 끼를 전할 분을 찾습니다</h1>
            </div>
            <p class="hero-subtitle">아래 활동 안내를 본 후 봉사 활동 신청을 해주세요.</p>
        </div>

        <a class="scroll-cue" href="#volunteer-info" aria-label="봉사자 모집 내용으로 이동">
            <span></span>
        </a>
    </header>

    <!-- 2. 상세 설명 및 폼 섹션 (아래로 스크롤) -->
    <main class="main-container" id="volunteer-info">
        
        <!-- 설명 구역 -->
        <div class="info-box">
            <h2>활동 안내</h2>
            <ul class="info-list">
                <li>
                    <strong>일시</strong>
                    <span>2026. 6. 25 (목) 10시 ~ 15시</span>
                </li>
                <li>
                    <strong>장소</strong>
                    <span>프란치스꼬의 집 (제기동)</span>
                </li>
                <li>
                    <strong>봉사 내용</strong>
                    <span>배식, 홀 서빙, 설거지, 청소 등</span>
                </li>
                <li>
                    <strong>모집 기간</strong>
                    <span>2026. 6. 4 ~ 6. 8</span>
                </li>
            </ul>
        </div>

        <!-- 스크롤 유도 아이콘 -->
        <div class="middle-scroll-container">
            <a class="middle-scroll-cue" href="#volunteerForm" aria-label="신청하기 양식으로 이동">
                <span></span>
            </a>
        </div>

        <!-- 입력 폼 구역 -->
        <div class="form-box">
            <h2>신청하기</h2>
            <form id="volunteerForm">
                <div class="form-group">
                    <label for="dept">부서명</label>
                    <input type="text" id="dept" name="dept" placeholder="소속 부서를 입력해주세요" required>
                </div>
                
                <div class="form-group">
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" placeholder="성함을 입력해주세요" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">전화번호</label>
                    <input type="tel" id="phone" name="phone" placeholder="010-0000-0000" required>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">봉사 신청하기</button>
            </form>
        </div>

    </main>

    <script>
        function resetInitialScroll() {
            const root = document.documentElement;
            const previousBehavior = root.style.scrollBehavior;

            root.style.scrollBehavior = 'auto';
            window.scrollTo(0, 0);

            requestAnimationFrame(() => {
                root.style.scrollBehavior = previousBehavior;
            });
        }

        function lockInitialScrollTop() {
            resetInitialScroll();
            [60, 180, 420, 800].forEach(delay => {
                window.setTimeout(resetInitialScroll, delay);
            });
        }

        window.addEventListener('pageshow', lockInitialScrollTop);

        document.addEventListener('DOMContentLoaded', function() {
            lockInitialScrollTop();

            const revealTargets = document.querySelectorAll('.main-container, .info-box, .middle-scroll-container, .form-box');
            const scrollCue = document.querySelector('.scroll-cue');
            const middleScrollCue = document.querySelector('.middle-scroll-cue');
            const volunteerInfo = document.getElementById('volunteer-info');
            const volunteerFormBox = document.querySelector('.form-box');

            if (scrollCue && volunteerInfo) {
                scrollCue.addEventListener('click', function(e) {
                    e.preventDefault();

                    volunteerInfo.scrollIntoView({
                        behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'
                    });

                    history.replaceState(null, document.title, window.location.pathname + window.location.search);
                });
            }

            if (middleScrollCue && volunteerFormBox) {
                middleScrollCue.addEventListener('click', function(e) {
                    e.preventDefault();

                    volunteerFormBox.scrollIntoView({
                        behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'
                    });

                    history.replaceState(null, document.title, window.location.pathname + window.location.search);
                });
            }

            if (!('IntersectionObserver' in window)) {
                revealTargets.forEach(target => target.classList.add('is-visible'));
                return;
            }

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;

                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target);
                });
            }, {
                threshold: 0.16,
                rootMargin: '0px 0px -10% 0px'
            });

            revealTargets.forEach(target => observer.observe(target));
        });

        // 폼 제출 처리 로직 (Google Apps Script 연동)
        document.getElementById('volunteerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.innerText = '신청 처리 중...';
            btn.disabled = true;

            // ⚠️ Google Apps Script(GAS) 웹 앱 URL을 여기에 붙여넣으세요.
            const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL';
            
            const formData = new URLSearchParams();
            formData.append('dept', document.getElementById('dept').value);
            formData.append('name', document.getElementById('name').value);
            formData.append('phone', document.getElementById('phone').value);

            // 데이터 전송
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
            .then(() => {
                alert('따뜻한 마음 감사합니다. 신청이 완료되었습니다!');
                document.getElementById('volunteerForm').reset();
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert('통신 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
            })
            .finally(() => {
                btn.innerText = '봉사 신청하기';
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
